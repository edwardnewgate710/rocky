name: CI

# Build, typecheck, and test every workspace package on each push and PR.
# Dependency order matters: `@chess-platform/game` and
# `@chess-platform/realtime-gateway` resolve `@chess-platform/core`'s types from
# its built `dist/`, so we BUILD before we lint/test. The root `build`, `lint`,
# and `test` scripts already fan out to the packages in the correct order
# (core -> game -> realtime-gateway).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No root lockfile yet, so use `npm install` (workspaces). Switch to
      # `npm ci` once a root package-lock.json is committed.
      - name: Install dependencies (workspaces)
        run: npm install

      - name: Build (core -> game -> realtime-gateway)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Test (node --test)
        run: npm test
