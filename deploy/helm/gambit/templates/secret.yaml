{{/*
Secret for sensitive values. Production must either provide explicit values or
reference an existing Secret; the chart never manufactures a known credential.
*/}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecrets.enabled) }}
{{- if lt (len .Values.secrets.accessTokenSecret) 32 }}
{{- fail "secrets.accessTokenSecret must be provided and contain at least 32 characters (or set secrets.existingSecret)" }}
{{- end }}
{{- if and .Values.postgres.enabled (empty .Values.secrets.postgresPassword) }}
{{- fail "secrets.postgresPassword must be provided when bundled Postgres is enabled (or set secrets.existingSecret)" }}
{{- end }}
{{- if eq .Values.email.provider "resend" }}
{{- fail "email.provider=resend requires secrets.existingSecret or secrets.externalSecrets; provider credentials are never rendered into an inline Secret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gambit.secretName" . }}
  labels:
    {{- include "gambit.labels" . | nindent 4 }}
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: {{ .Values.secrets.accessTokenSecret | quote }}

  {{- /*
    POSTGRES_PASSWORD: only needed when bundled postgres is enabled.
    Required explicitly when this chart manages bundled Postgres.
  */}}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
{{- end }}
