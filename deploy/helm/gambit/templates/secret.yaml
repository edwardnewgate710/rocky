{{/*
Secret for sensitive values: ACCESS_TOKEN_SECRET + POSTGRES_PASSWORD.
Values are templated from .Values with placeholder defaults.
Do NOT commit real secret values — provide via helm --set or external-secrets.
Full secrets-manager integration (Vault, AWS Secrets Manager) is a later M14
increment — see docs/adr/0009-kubernetes-helm.md.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gambit.secretName" . }}
  labels:
    {{- include "gambit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    ACCESS_TOKEN_SECRET: HMAC secret shared between API and gateway.
    Placeholder default for local dev/kind; override in production.
  */}}
  ACCESS_TOKEN_SECRET: {{ .Values.secrets.accessTokenSecret | default "dev-secret-change-me-in-production-at-least-32-bytes!!" | quote }}

  {{- /*
    POSTGRES_PASSWORD: only needed when bundled postgres is enabled.
    Placeholder default for local dev/kind; override in production.
  */}}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "gambit_dev" | quote }}
  {{- end }}
