{{/*
ExternalSecret custom resource for external-secrets.io integration.
When enabled, this resource replaces the inline Opaque Secret and instructs
the External Secrets Operator (ESO) to sync secrets from a SecretStore /
ClusterSecretStore into a Kubernetes Secret named <fullname>-secret.
Requires the External Secrets Operator installed in-cluster.
*/}}
{{- if .Values.secrets.externalSecrets.enabled }}
{{- if .Values.secrets.existingSecret }}
{{- fail "secrets.externalSecrets.enabled and secrets.existingSecret are mutually exclusive" }}
{{- end }}
{{- if or (not (empty .Values.secrets.accessTokenSecret)) (not (empty .Values.secrets.postgresPassword)) }}
{{- fail "secrets.externalSecrets.enabled is mutually exclusive with inline secrets.accessTokenSecret / secrets.postgresPassword" }}
{{- end }}
{{- if empty .Values.secrets.externalSecrets.secretStore.name }}
{{- fail "secrets.externalSecrets.secretStore.name is required when external secrets are enabled" }}
{{- end }}
{{- if not (has .Values.secrets.externalSecrets.secretStore.kind (list "SecretStore" "ClusterSecretStore")) }}
{{- fail "secrets.externalSecrets.secretStore.kind must be SecretStore or ClusterSecretStore" }}
{{- end }}
{{- if empty .Values.secrets.externalSecrets.accessTokenSecret.key }}
{{- fail "secrets.externalSecrets.accessTokenSecret.key is required" }}
{{- end }}
{{- if and .Values.postgres.enabled (empty .Values.secrets.externalSecrets.postgresPassword.key) }}
{{- fail "secrets.externalSecrets.postgresPassword.key is required when bundled Postgres is enabled" }}
{{- end }}
{{- if and (eq .Values.email.provider "resend") (empty .Values.secrets.externalSecrets.resendApiKey.key) }}
{{- fail "secrets.externalSecrets.resendApiKey.key is required when email.provider=resend" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gambit.fullname" . }}-secret
  labels:
    {{- include "gambit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStore.name | quote }}
    kind: {{ .Values.secrets.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "gambit.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_TOKEN_SECRET
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.accessTokenSecret.key | quote }}
        {{- with .Values.secrets.externalSecrets.accessTokenSecret.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- if eq .Values.email.provider "resend" }}
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.resendApiKey.key | quote }}
        {{- with .Values.secrets.externalSecrets.resendApiKey.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- if .Values.postgres.enabled }}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.postgresPassword.key | quote }}
        {{- with .Values.secrets.externalSecrets.postgresPassword.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
