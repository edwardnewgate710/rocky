# ===========================================================================
# Gambit Helm Chart — Staging Environment Values
# ===========================================================================
# Applied during staging deployments via `helm upgrade -f deploy/environments/staging.values.yaml`.
# No secrets are stored in this file: secret credentials are referenced via
# `secrets.existingSecret` or External Secrets Operator integration (ADR-0044).
# ===========================================================================

config:
  nodeEnv: staging

email:
  provider: resend
  # deploy.yml supplies both values from the staging GitHub Environment variables.
  from: ""
  publicWebOrigin: ""

images:
  api:
    tag: "0.1.0"
  web:
    tag: "0.1.0"

web:
  replicas: 2
  ingress:
    enabled: true
    className: nginx
    host: staging.gambit.local

api:
  replicas: 2

gateway:
  replicas: 2

secrets:
  # Must contain ACCESS_TOKEN_SECRET and RESEND_API_KEY.
  existingSecret: "gambit-staging-secrets"
