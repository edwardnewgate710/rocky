server {
    listen 8080;
    server_name _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any route not matching a static file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Prometheus registry is an operational surface, not a public one. Its `route` label
    # enumerates every endpoint the API exposes, with per-route request volume and status
    # distribution — including which endpoints return 401/403/500, and how busy /v1/moderation is.
    # Prometheus scrapes the API Service directly inside the cluster, so nothing legitimate
    # reaches it through this public proxy. Declared before `/v1/` because nginx prefers an
    # exact `=` match over a prefix match.
    #
    # The regex must accept the trailing slash. The API router's splitPath() drops empty segments,
    # so `/v1/metrics/` resolves to the SAME route and serves the registry — an exact-match
    # `location = /v1/metrics` looked correct and let that form straight through. `/?$` anchors the
    # match so `/v1/metricsfoo` is still proxied normally.
    location ~ ^/v1/metrics/?$ {
        return 404;
    }

    # Proxy REST API requests to the API service
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections to the gateway service
    location /ws {
        proxy_pass http://gateway:4175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve the public port (for example localhost:3000). The gateway's
        # same-origin WebSocket guard compares Origin.host with this header;
        # `$host` drops the port and caused every browser upgrade to fail 401.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
