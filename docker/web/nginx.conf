server {
    listen 8080;
    server_name _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any route not matching a static file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to the API service
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections to the gateway service
    location /ws {
        proxy_pass http://gateway:4175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve the public port (for example localhost:3000). The gateway's
        # same-origin WebSocket guard compares Origin.host with this header;
        # `$host` drops the port and caused every browser upgrade to fail 401.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
