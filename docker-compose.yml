services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gambit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gambit_dev}
      POSTGRES_DB: gambit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gambit -d gambit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gambit:${POSTGRES_PASSWORD:-gambit_dev}@postgres:5432/gambit
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-secret-change-me-in-production-at-least-32-bytes!!}
      PORT: "8080"
      NODE_ENV: production
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-secret-change-me-in-production-at-least-32-bytes!!}
      ACCESS_TOKEN_TTL_SEC: "900"
      PORT: "4175"
      HOST: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "${GATEWAY_PORT:-4175}:4175"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4176/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
