name: CI

# Build, typecheck, and test every workspace package on each push and PR.
# Dependency order matters: downstream packages resolve upstream types from
# built `dist/`, so we BUILD before we lint/test. The root `build`, `lint`,
# and `test` scripts already fan out to the packages in dependency order
# (core -> game -> realtime-gateway -> persistence -> api -> engine -> web).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Test (node --test)
        run: npm test

  # Runs the Postgres-gated integration tests (persistence event store +
  # repositories against a real database). Everything else is hermetic.
  postgres-integration:
    name: postgres integration (persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Test persistence against Postgres
        run: npm test --workspace @chess-platform/persistence

  # M6 acceptance gate: Playwright e2e (full game vs bot + vs human) +
  # Lighthouse a11y audit (score must be >= 95). Runs the e2e harness
  # (in-memory API + gateway + bot) alongside vite preview so the specs
  # exercise real HTTP + WebSocket flows. Reports are uploaded as artifacts.
  m6-acceptance:
    name: M6 acceptance (Playwright e2e + Lighthouse a11y)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order, includes e2e-harness)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Run Playwright e2e (GAMBIT_E2E_BACKEND=1)
        run: npm run e2e
        working-directory: packages/web
        env:
          GAMBIT_E2E_BACKEND: '1'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/web/test-results/
          retention-days: 30

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli@0.13.0

      - name: Start vite preview for Lighthouse
        run: |
          npm run build
          npx vite preview --port 4173 &
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4173 | grep -q '.'; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        working-directory: packages/web

      - name: Run Lighthouse a11y audit
        run: |
          # Run Lighthouse with Chrome flags for CI (no-sandbox)
          lhci collect \
            --url http://127.0.0.1:4173 \
            --numberOfRuns=1 \
            --settings.preset=desktop \
            --settings.chromeFlags="--no-sandbox --headless=new --disable-gpu"
          # Extract the a11y score from the Lighthouse JSON report
          A11Y_SCORE=$(jq '.categories.accessibility.score' $(find .lighthouseci -name 'lhr-*.json' | head -1))
          echo "Lighthouse a11y score: $A11Y_SCORE"
          # Fail if below 0.95
          if (( $(echo "$A11Y_SCORE < 0.95" | bc -l) )); then
            echo "::error::Lighthouse a11y score ($A11Y_SCORE) is below 0.95"
            exit 1
          fi
          echo "A11Y_SCORE=$A11Y_SCORE" >> "$GITHUB_ENV"
        working-directory: packages/web

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: packages/web/.lighthouseci/
          retention-days: 30
