name: CI

# Build, typecheck, and test every workspace package on each push and PR.
# Dependency order matters: downstream packages resolve upstream types from
# built `dist/`, so we BUILD before we lint/test. The root `build`, `lint`,
# and `test` scripts already fan out to the packages in dependency order
# (core -> game -> realtime-gateway -> persistence -> api -> engine -> web).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Test (node --test)
        run: npm test

  # Runs the Postgres-gated integration tests (persistence event store +
  # repositories against a real database). Everything else is hermetic.
  postgres-integration:
    name: postgres integration (persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Test persistence against Postgres
        run: npm test --workspace @chess-platform/persistence

      - name: Test API concurrency controls against Postgres
        run: npm test --workspace @chess-platform/api

  # Builds, typechecks, and tests the deployable gateway service. It is NOT a
  # root workspace, so the build-test job above never compiles it — this job is
  # its only CI coverage. The single-owner command-routing suite (ADR-0010)
  # runs against a real Redis.
  gateway-service:
    name: gateway service (build + Redis integration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job runs repository-controlled build/lint/test scripts and
          # needs no authenticated Git access, so don't leave the token in
          # .git/config for those scripts to read.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install workspace dependencies (reproducible)
        run: npm ci

      - name: Build domain packages (dependency order)
        run: npm run build

      - name: Install gateway service dependencies (reproducible)
        run: npm ci
        working-directory: services/gateway

      - name: Build + typecheck gateway service
        run: npm run build && npm run lint
        working-directory: services/gateway

      - name: Test gateway service against Redis
        run: npm test
        working-directory: services/gateway

  # M6 acceptance gate: Playwright e2e (full game vs bot + vs human) +
  # Lighthouse a11y audit (score must be >= 95). Runs the e2e harness
  # (in-memory API + gateway + bot) alongside vite preview so the specs
  # exercise real HTTP + WebSocket flows. Reports are uploaded as artifacts.
  m6-acceptance:
    name: M6 acceptance (Playwright e2e + Lighthouse a11y)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order, includes e2e-harness)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: packages/web

      - name: Run Playwright e2e (GAMBIT_E2E_BACKEND=1)
        run: npm run e2e
        working-directory: packages/web
        env:
          GAMBIT_E2E_BACKEND: '1'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/web/test-results/
          retention-days: 30

      - name: Run Lighthouse a11y audit
        run: |
          # Start vite preview in the background
          npx vite preview --port 4173 --host 127.0.0.1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT

          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4173 > /dev/null 2>&1; then
              echo "Vite preview is ready"
              break
            fi
            sleep 1
          done

          # Verify server is responding
          curl -s http://127.0.0.1:4173 | head -5

          # Install lighthouse and run it directly
          npm install -g lighthouse@11.4.0

          # Point Lighthouse at the Chromium that Playwright already installed
          # in the earlier step. Lighthouse otherwise searches system paths and
          # fails with "Unable to connect to Chrome" on the runner.
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Using CHROME_PATH=$CHROME_PATH"

          # Infrastructure failures are failures too: a green acceptance job
          # must prove that Lighthouse actually ran and produced a score.
          lighthouse http://127.0.0.1:4173 \
            --output=json --output=html \
            --output-path=./lighthouse-report \
            --chrome-flags="--no-sandbox --headless=new --disable-gpu --disable-dev-shm-usage" \
            --only-categories=accessibility \
            --preset=desktop \
            --quiet

          test -f ./lighthouse-report.report.json

          # A report exists: enforce the real a11y threshold.
          A11Y_SCORE=$(jq '.categories.accessibility.score' ./lighthouse-report.report.json)
          echo "Lighthouse a11y score: $A11Y_SCORE"

          if [ "$A11Y_SCORE" = "null" ] || [ -z "$A11Y_SCORE" ]; then
            echo "::error::Lighthouse report is missing the accessibility score"
            exit 1
          fi

          # Fail only on a genuine sub-threshold accessibility score.
          if (( $(echo "$A11Y_SCORE < 0.95" | bc -l) )); then
            echo "::error::Lighthouse a11y score ($A11Y_SCORE) is below 0.95"
            exit 1
          fi
          echo "A11Y_SCORE=$A11Y_SCORE" >> "$GITHUB_ENV"
        working-directory: packages/web

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            packages/web/lighthouse-report.report.json
            packages/web/lighthouse-report.report.html
          retention-days: 30

  # M14 increment 4: Helm chart validation.
  # Lints the chart and validates rendered manifests against Kubernetes
  # schemas with kubeconform, for both default values and an external-
  # datastore override.
  helm:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint
        run: >-
          helm lint deploy/helm/gambit
          --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum
          --set secrets.postgresPassword=test-only-postgres-password

      - name: Helm rejects missing access-token secret
        run: |
          if helm template deploy/helm/gambit >/dev/null 2>&1; then
            echo "::error::chart rendered with a missing access-token secret"
            exit 1
          fi

      - name: Helm template (default values) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set secrets.postgresPassword=test-only-postgres-password \
            | kubeconform -strict -summary

      - name: Helm template (external datastores) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set postgres.enabled=false \
            --set redis.enabled=false \
            --set externalDatabaseUrl=postgres://user:pass@db.example.com:5432/gambit \
            --set externalRedisUrl=redis://redis.example.com:6379 \
            | kubeconform -strict -summary
