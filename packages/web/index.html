<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161512" />
    <title>Gambit</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a id="skip-board" class="skip-link" href="#board" hidden>Skip to board</a>
    <header class="topbar">
      <h1><a href="/" data-route="lobby">Gambit</a></h1>
      <nav class="nav">
        <a href="/" data-route="lobby">Lobby</a>
        <a href="/profile" data-route="profile">Profile</a>
      </nav>
      <span id="auth-status" role="status" aria-live="polite">Not signed in</span>
      <button id="auth-logout" type="button" aria-label="Sign out" hidden>Sign out</button>
      <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">🌙</button>
      <button id="flip" type="button" aria-label="Flip board" hidden>Flip</button>
    </header>
    <main class="game" id="game-main">
      <section id="board" aria-label="Chess board"></section>
      <aside class="sidebar" aria-label="Game info">
        <p id="status" role="status" aria-live="polite" tabindex="-1">Your move.</p>

        <section id="game-metadata" class="metadata-panel" aria-label="Game information">
          <div id="meta-live-status" aria-live="polite" class="sr-only"></div>
          <div class="metadata-row">
            <span class="metadata-label">Connection</span>
            <span id="meta-connection" class="metadata-value">Offline</span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">Role</span>
            <span id="meta-role" class="metadata-value">Waiting…</span>
          </div>
          <div class="metadata-row">
            <span id="meta-white-name" class="metadata-label">White</span>
            <span id="meta-white" class="metadata-value">
              <span class="presence-dot offline" aria-hidden="true"></span>
              <span class="presence-text">Offline</span>
            </span>
          </div>
          <div class="metadata-row">
            <span id="meta-black-name" class="metadata-label">Black</span>
            <span id="meta-black" class="metadata-value">
              <span class="presence-dot offline" aria-hidden="true"></span>
              <span class="presence-text">Offline</span>
            </span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">Spectators</span>
            <span id="meta-spectators" class="metadata-value">0</span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">Variant</span>
            <span id="meta-variant" class="metadata-value">-</span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">Time Control</span>
            <span id="meta-time" class="metadata-value">-</span>
          </div>
        </section>

        <div id="clock" class="clock" aria-label="Clocks">
          <div id="clock-white" class="clock-side" data-active="true">
            <span class="clock-label">White</span>
            <span class="clock-time">10:00</span>
          </div>
          <div id="clock-black" class="clock-side">
            <span class="clock-label">Black</span>
            <span class="clock-time">10:00</span>
          </div>
        </div>
        <div id="game-actions" class="game-actions" role="group" aria-label="Game actions" hidden>
          <div id="action-error" class="error" role="alert" aria-live="polite" hidden></div>
          <button id="action-offer-draw" type="button" class="button">Offer draw</button>
          <button id="action-claim-flag" type="button" class="button">Claim timeout</button>
          <div class="action-row">
            <button id="action-resign" type="button" class="button destructive">Resign</button>
            <div id="confirm-resign" class="confirm-inline" hidden>
              <span>Sure?</span>
              <button id="confirm-resign-yes" type="button" class="button destructive" aria-label="Confirm resignation">Yes</button>
              <button id="confirm-resign-no" type="button" class="button" aria-label="Cancel resignation">No</button>
            </div>
          </div>
          <div class="action-row">
            <button id="action-abort" type="button" class="button destructive">Abort</button>
            <div id="confirm-abort" class="confirm-inline" hidden>
              <span>Sure?</span>
              <button id="confirm-abort-yes" type="button" class="button destructive" aria-label="Confirm abort">Yes</button>
              <button id="confirm-abort-no" type="button" class="button" aria-label="Cancel abort">No</button>
            </div>
          </div>
          <div id="draw-offer-received" class="draw-offer-banner" role="alert" hidden>
            <span>Opponent offered a draw</span>
            <button id="action-accept-draw" type="button" class="button primary">Accept</button>
            <button id="action-decline-draw" type="button" class="button">Decline</button>
          </div>
        </div>
      </aside>
    </main>
    <section id="auth" class="auth" aria-label="Sign in">
      <form id="auth-form" onsubmit="return false">
        <label for="auth-handle">Handle</label>
        <input id="auth-handle" type="text" autocomplete="username" required />
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required />
        <button id="auth-submit" type="button">Sign in</button>
        <button id="auth-register" type="button">Register</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
    </section>
    <section id="lobby" class="lobby" aria-label="Lobby" hidden>
      <div id="create-game" class="create-game"></div>
      <h2>Open seeks</h2>
      <div id="seek-list" class="seek-list" role="list"></div>
      <p id="lobby-error" class="error" role="alert"></p>
    </section>
    <section id="profile" class="profile" aria-label="Profile" hidden>
      <h2 id="profile-handle">Profile</h2>
      <div id="profile-ratings" class="ratings" aria-label="Ratings"></div>
      <h3>Recent games</h3>
      <div id="profile-games" class="game-list" aria-label="Recent games"></div>
      <p id="profile-error" class="error" role="alert"></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
